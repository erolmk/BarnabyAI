<!doctype html>
<html><head><meta charset="utf-8"><title>Mail - Mary Wilson - Outlook</title>
<style>
  body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;background:#f3f2f1;color:#201f1e;height:100vh;overflow:hidden}
  header{height:48px;background:#0f6cbd;color:#fff;display:flex;align-items:center;padding:0 16px;gap:16px}
  header input{width:460px;height:32px;border:0;border-radius:4px;padding:0 10px}
  .ribbon{height:44px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #e1dfdd}
  #new{height:32px;padding:0 14px;border:0;border-radius:4px;background:#0f6cbd;color:#fff;font-weight:600;cursor:pointer}
  .rb{height:32px;border:0;background:none;padding:0 10px;cursor:pointer}
  nav{position:absolute;top:92px;left:0;width:200px;bottom:0;background:#faf9f8;padding-top:8px}
  nav div{padding:8px 20px}nav .on{background:#e1dfdd;font-weight:600}
  #list{position:absolute;top:92px;left:200px;width:360px;bottom:0;background:#fff;border-right:1px solid #e1dfdd;margin:0;padding:0;list-style:none}
  #list li{padding:10px 16px;border-bottom:1px solid #f3f2f1}
  #pane{position:absolute;top:92px;left:560px;right:0;bottom:0;background:#fff;padding:16px 24px}
  #pane .row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e1dfdd;height:42px}
  #pane input{flex:1;border:0;outline:0;font-size:14px;height:36px}
  #obody{width:100%;height:300px;border:0;outline:0;font:14px 'Segoe UI';margin-top:12px;resize:none}
  #osend{height:32px;padding:0 20px;border:0;border-radius:4px;background:#0f6cbd;color:#fff;font-weight:600;cursor:pointer}
  .chip{display:inline-flex;gap:8px;border:1px solid #c8c6c4;border-radius:4px;padding:6px 10px;margin:8px 8px 0 0}
</style></head>
<body>
<header><b>Outlook</b><input aria-label="Search" placeholder="Search"><span style="margin-left:auto">MW</span></header>
<div class="ribbon"><button id="new">✉ New mail</button><button class="rb">Delete</button><button class="rb">Archive</button><button class="rb">Report</button><button class="rb" id="oattach" aria-label="Attach file" hidden>📎 Attach file</button></div>
<nav><div class="on">Inbox 2</div><div>Junk Email</div><div>Drafts</div><div>Sent Items</div><div>Deleted Items</div></nav>
<ul id="list"><li><b>Sarah Wilson</b><br>Sunday dinner</li><li><b>Anne Marie B.</b><br>Lovely lunch on Tuesday</li><li>Microsoft account team<br>Security info summary</li></ul>
<div id="pane"><p style="color:#605e5c;margin-top:120px;text-align:center">Select an item to read</p></div>
<script src="sim.js"></script>
<script>
const $ = (s) => document.getElementById(s);
let atts = [];
$('new').onclick = () => {
  $('oattach').hidden = false;
  $('pane').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:8px"><button id="osend">Send</button><button class="rb" id="odiscard">Discard</button></div>
    <div class="row"><span>To</span><input id="oto" aria-label="To"></div>
    <div class="row"><span>Cc</span><input aria-label="Cc"></div>
    <div class="row"><input id="osubj" aria-label="Add a subject" placeholder="Add a subject"></div>
    <div id="oatts"></div>
    <textarea id="obody" aria-label="Message body, press Alt+F10 to exit" placeholder="Type / to insert files and more"></textarea>`;
  $('oto').focus();
  $('odiscard').onclick = () => location.reload();
  $('osend').onclick = () => {
    const err = SIM.badAddress($('oto').value);
    if (err) { SIM.toast(err); return; }
    SIM.recordSent({ provider: 'outlook', to: $('oto').value.trim(), subject: $('osubj').value, body: $('obody').value, attachments: atts.map((a) => a.name) });
    $('pane').innerHTML = '<p style="margin-top:120px;text-align:center">Select an item to read</p>';
    $('oattach').hidden = true;
    atts = [];
    SIM.toast('Your message has been sent.');
  };
};
$('oattach').onclick = () => SIM.openPicker((files) => {
  for (const f of files) if (!atts.some((a) => a.name === f.name)) atts.push(f);
  const box = $('oatts');
  if (box) box.innerHTML = atts.map((a) => `<span class="chip">🖼️ ${a.name} ${a.size}</span>`).join('');
});
</script>
</body></html>
