<!doctype html>
<html><head><meta charset="utf-8"><title>Inbox (3) - mary.wilson@gmail.com - Gmail</title>
<style>
  body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;background:#f6f8fc;color:#1f1f1f;height:100vh;overflow:hidden}
  header{height:64px;display:flex;align-items:center;gap:16px;padding:0 16px}
  .logo{font-size:22px;color:#444;width:200px}.logo b{color:#d93025}
  .search{flex:1;max-width:720px;height:46px;border-radius:24px;border:0;background:#e9eef6;padding:0 20px;font-size:16px}
  .avatar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#7b1fa2;color:#fff;display:flex;align-items:center;justify-content:center}
  nav{position:absolute;top:64px;left:0;width:240px}
  #compose-btn{margin:8px 0 16px 8px;height:56px;padding:0 24px 0 18px;border:0;border-radius:16px;background:#c2e7ff;font-size:15px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer}
  nav ul{list-style:none;margin:0;padding:0}
  nav li{height:32px;display:flex;align-items:center;padding:0 12px 0 26px;border-radius:0 16px 16px 0;margin-right:8px}
  nav li.on{background:#d3e3fd;font-weight:700}
  main{position:absolute;top:64px;left:256px;right:16px;bottom:16px;background:#fff;border-radius:16px;overflow:hidden}
  .tabs{display:flex;border-bottom:1px solid #eee}.tabs div{padding:14px 24px;color:#444}.tabs .on{color:#0b57d0;border-bottom:3px solid #0b57d0}
  #inbox{list-style:none;margin:0;padding:0}
  #inbox li{display:flex;gap:16px;height:40px;align-items:center;padding:0 16px;border-bottom:1px solid #f1f1f1;cursor:pointer}
  #inbox li.unread{font-weight:700;background:#fff}#inbox li:not(.unread){background:#f2f6fc}
  #inbox .from{width:190px;flex:none}#inbox .snip{color:#5f6368;font-weight:400}
  #compose{position:fixed;right:24px;bottom:0;width:560px;height:590px;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 8px 24px #0005;display:flex;flex-direction:column}
  #compose .bar{height:40px;background:#f2f6fc;border-radius:10px 10px 0 0;display:flex;align-items:center;padding:0 8px 0 16px;font-weight:600}
  #compose .bar button{margin-left:auto;border:0;background:none;font-size:18px;width:34px;height:34px;cursor:pointer}
  #compose .row{display:flex;align-items:center;border-bottom:1px solid #eee;margin:0 16px;height:40px;position:relative}
  #compose .row label{color:#5f6368;width:30px}
  #compose .row input{flex:1;border:0;outline:0;font-size:14px;height:36px}
  #body{flex:1;border:0;outline:0;margin:8px 16px;font:14px 'Segoe UI',Arial;resize:none}
  #atts{margin:0 16px;display:flex;flex-direction:column;gap:6px}
  .chip{display:flex;align-items:center;gap:10px;background:#f5f5f5;border-radius:4px;padding:6px 10px;color:#0b57d0;font-weight:600;width:300px}
  .chip button{margin-left:auto;border:0;background:none;cursor:pointer}
  #compose .tools{height:64px;display:flex;align-items:center;gap:6px;padding:0 16px}
  #send{height:40px;padding:0 24px;border:0;border-radius:20px;background:#0b57d0;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .ic{width:36px;height:36px;border:0;background:none;font-size:18px;cursor:pointer;border-radius:50%}
  #suggest{position:absolute;top:40px;left:30px;background:#fff;box-shadow:0 2px 8px #0004;list-style:none;margin:0;padding:4px 0;z-index:10;width:380px}
  #suggest li{padding:8px 12px;cursor:pointer}#suggest li:hover{background:#eee}
  #err{position:fixed;inset:0;background:#0004;z-index:6000;display:flex;align-items:center;justify-content:center}
  #err div{background:#fff;padding:24px;width:420px;border-radius:8px;box-shadow:0 4px 20px #0006}
  #reading{padding:24px 32px}
</style></head>
<body>
<header><div class="logo">☰ &nbsp;<b>M</b> Gmail</div><input class="search" aria-label="Search mail" placeholder="Search mail"><div class="avatar" aria-label="Google Account: Mary Wilson">M</div></header>
<nav>
  <button id="compose-btn">✏️ Compose</button>
  <ul><li class="on">Inbox <span style="margin-left:auto">3</span></li><li>Starred</li><li>Snoozed</li><li id="nav-sent">Sent</li><li>Drafts</li><li>More</li></ul>
</nav>
<main>
  <div class="tabs"><div class="on">Primary</div><div>Promotions</div><div>Social</div></div>
  <ul id="inbox"></ul>
  <div id="reading" hidden></div>
</main>
<section id="compose" hidden aria-label="New Message">
  <div class="bar">New Message<button aria-label="Minimize">_</button><button id="c-close" aria-label="Save &amp; close">✕</button></div>
  <div class="row"><label for="to">To</label><input id="to" aria-label="To recipients" autocomplete="off"><ul id="suggest" hidden></ul></div>
  <div class="row"><input id="subject" aria-label="Subject" placeholder="Subject"></div>
  <textarea id="body" aria-label="Message Body"></textarea>
  <div id="atts"></div>
  <div class="tools"><button id="send">Send</button><button class="ic" aria-label="Formatting options">A</button><button class="ic" id="attach" aria-label="Attach files" title="Attach files">📎</button><button class="ic" aria-label="Insert link">🔗</button><button class="ic" aria-label="Insert emoji">🙂</button><button class="ic" aria-label="Insert photo">🖼️</button><button class="ic" id="discard" aria-label="Discard draft" style="margin-left:auto">🗑️</button></div>
</section>
<script src="sim.js"></script>
<script>
const CONTACTS = [
  { name: 'Anne Marie B.', email: 'annemarie.b@example.com' },
  { name: 'Sarah Wilson', email: 'sarah.wilson@example.com' },
  { name: 'Dr. Patel Office', email: 'frontdesk@patelfamilymed.example.com' },
];
const MAILS = [
  { from: 'Sarah Wilson', subj: 'Sunday dinner', snip: 'Hi Mom, are we still on for Sunday? I can bring dessert…', unread: true, time: '9:41 AM' },
  { from: 'Anne Marie B.', subj: 'Lovely lunch on Tuesday', snip: 'It was so good to see you! Send me pictures of your roses when you can.', unread: true, time: 'Sep 24' },
  { from: 'Walgreens', subj: 'Your prescription is ready', snip: 'Your order is ready for pickup at 1200 Main St…', unread: true, time: 'Sep 23' },
  { from: 'First Baptist Church', subj: 'Bulletin for September 21', snip: 'Please find this week’s bulletin attached.', unread: false, time: 'Sep 20' },
  { from: 'Medicare.gov', subj: 'Your Medicare Summary Notice is ready', snip: 'Sign in to view your summary notice…', unread: false, time: 'Aug 29' },
];
const $ = (s) => document.getElementById(s);
const inbox = $('inbox');
for (const m of MAILS) {
  const li = document.createElement('li');
  if (m.unread) li.className = 'unread';
  li.innerHTML = `<span class="from">${m.from}</span><span>${m.subj} <span class="snip">- ${m.snip}</span></span><span style="margin-left:auto">${m.time}</span>`;
  li.addEventListener('click', () => { inbox.hidden = true; const r = $('reading'); r.hidden = false; r.innerHTML = `<h2>${m.subj}</h2><p><b>${m.from}</b></p><p>${m.snip}</p><button onclick="location.reload()">← Back to Inbox</button>`; });
  inbox.appendChild(li);
}
let atts = [];
function paintAtts() {
  const box = $('atts');
  box.innerHTML = '';
  for (const f of atts) {
    const d = document.createElement('div');
    d.className = 'chip';
    d.innerHTML = `<span>${f.name} (${f.size})</span>`;
    const x = document.createElement('button');
    x.setAttribute('aria-label', 'Remove attachment ' + f.name);
    x.textContent = '✕';
    x.onclick = () => { atts = atts.filter((a) => a !== f); paintAtts(); };
    d.appendChild(x);
    box.appendChild(d);
  }
}
function openCompose() { $('compose').hidden = false; document.title = 'Compose Mail - mary.wilson@gmail.com - Gmail'; $('to').focus(); }
function closeCompose() { $('compose').hidden = true; $('to').value = ''; $('subject').value = ''; $('body').value = ''; atts = []; paintAtts(); document.title = 'Inbox (3) - mary.wilson@gmail.com - Gmail'; }
$('compose-btn').onclick = openCompose;
$('c-close').onclick = closeCompose;
$('discard').onclick = closeCompose;
$('attach').onclick = () => SIM.openPicker((files) => { for (const f of files) if (!atts.some((a) => a.name === f.name)) atts.push(f); paintAtts(); });
const sug = $('suggest');
$('to').addEventListener('input', () => {
  const v = $('to').value.trim().toLowerCase();
  const hits = v.length >= 2 ? CONTACTS.filter((c) => c.name.toLowerCase().includes(v) || c.email.startsWith(v)) : [];
  sug.innerHTML = '';
  for (const c of hits) {
    const li = document.createElement('li');
    li.textContent = c.name + ' <' + c.email + '>';
    li.onclick = () => { $('to').value = c.email; sug.hidden = true; $('subject').focus(); };
    sug.appendChild(li);
  }
  sug.hidden = !hits.length;
});
$('to').addEventListener('blur', () => setTimeout(() => { sug.hidden = true; }, 200));
$('send').onclick = () => {
  const err = SIM.badAddress($('to').value);
  if (err) {
    const d = document.createElement('div');
    d.id = 'err';
    d.innerHTML = `<div role="alertdialog" aria-label="Error"><h3>Error</h3><p>${err.replace(/</g, '&lt;')}</p><button id="err-ok" style="float:right;padding:8px 20px">OK</button></div>`;
    document.body.appendChild(d);
    $('err-ok').onclick = () => d.remove();
    return;
  }
  SIM.recordSent({ provider: 'gmail', to: $('to').value.trim(), subject: $('subject').value, body: $('body').value, attachments: atts.map((a) => a.name) });
  closeCompose();
  SIM.toast('Message sent.   Undo   View message');
};
</script>
</body></html>
