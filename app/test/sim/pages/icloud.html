<!doctype html>
<html><head><meta charset="utf-8"><title>iCloud</title>
<style>
  body{margin:0;font:15px -apple-system,'Segoe UI',Arial,sans-serif;background:#fff;color:#1d1d1f;height:100vh;overflow:hidden}
  #signin{display:flex;flex-direction:column;align-items:center;padding-top:90px}
  #signin h1{font-size:30px;font-weight:600;margin:18px 0 28px}
  .field{width:340px;height:46px;border:1px solid #d2d2d7;border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:12px;box-sizing:border-box}
  #signin-btn{width:340px;height:46px;border:0;border-radius:12px;background:#0071e3;color:#fff;font-size:16px;cursor:pointer}
  #lib{display:flex;height:100vh}
  aside{width:220px;background:#f5f5f7;padding:18px 0}
  aside h3{margin:0 18px 12px;font-size:13px;color:#86868b}
  aside li{list-style:none;padding:8px 18px}aside li.on{background:#e3e3e8;border-radius:8px;margin:0 8px;padding:8px 10px}
  aside ul{margin:0;padding:0}
  section{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{height:56px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #e5e5ea;gap:6px}
  .top h2{margin:0;font-size:20px}
  .top .count{color:#86868b;margin-left:12px}
  .tb{width:40px;height:40px;border:0;background:none;font-size:20px;border-radius:8px;cursor:pointer;color:#0071e3}
  .tb:disabled{color:#c7c7cc;cursor:default}
  #grid{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;align-content:start;overflow:auto}
  .ph{position:relative;aspect-ratio:1/1;cursor:pointer}
  .ph img{width:100%;height:100%;display:block;object-fit:cover}
  .ph.sel img{outline:4px solid #0071e3;outline-offset:-4px}
  .ph.sel::after{content:'✓';position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:#0071e3;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  #viewer{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:100}
  #viewer img{max-width:70%;max-height:80%}
  #viewer button{position:absolute;top:16px;border:0;background:#fff3;color:#fff;font-size:18px;height:40px;padding:0 16px;border-radius:8px;cursor:pointer}
  #dlbar{position:fixed;right:16px;top:12px;background:#fff;border:1px solid #ddd;box-shadow:0 4px 16px #0003;border-radius:10px;padding:12px 16px;width:300px;z-index:200}
</style></head>
<body>
<div id="signin">
  <div style="font-size:44px"></div>
  <h1>Sign in with Apple Account</h1>
  <input class="field" id="acct" aria-label="Email or Phone Number" value="mary.wilson@example.com">
  <input class="field" id="pw" type="password" aria-label="Password" placeholder="Password">
  <label style="width:340px;margin:4px 0 16px"><input type="checkbox" id="keep"> Keep me signed in</label>
  <button id="signin-btn">Sign In</button>
  <p style="margin-top:24px"><a href="#" style="color:#0071e3">Forgot password?</a></p>
</div>
<div id="lib" hidden>
  <aside><h3>Photos</h3><ul><li class="on">Library</li><li>Memories</li><li>Recently Saved</li><li>Favorites</li><li>Recently Deleted</li></ul>
    <h3 style="margin-top:22px">Albums</h3><ul><li>Garden</li><li>Family</li></ul></aside>
  <section>
    <div class="top"><h2>Library</h2><span class="count" id="count">12 Photos</span>
      <span style="margin-left:auto"></span>
      <button class="tb" aria-label="Upload" title="Upload">⤒</button>
      <button class="tb" id="share" aria-label="Share" title="Share" disabled>⇪</button>
      <button class="tb" id="dl" aria-label="Download" title="Download" disabled>⤓</button>
      <button class="tb" id="fav" aria-label="Favorite" title="Favorite" disabled>♡</button>
      <button class="tb" id="del" aria-label="Delete" title="Delete" disabled>🗑</button>
      <button class="tb" aria-label="More" title="More">⋯</button>
    </div>
    <div id="grid" role="grid" aria-label="Library"></div>
  </section>
</div>
<div id="viewer" hidden><img id="vimg" alt=""><button style="left:16px" id="vclose">✕ Close</button></div>
<script src="sim.js"></script>
<script>
const PHOTOS = [
  ['Garden roses, May 2026', 'IMG_2041.JPG', '🌹', '#2e7d32', '#c62828'],
  ['Grandchildren at the beach, July 2026', 'IMG_2110.JPG', '🏖️', '#4fc3f7', '#ffe082'],
  ['Birthday cake, June 2026', 'IMG_2077.JPG', '🎂', '#f8bbd0', '#8d6e63'],
  ['Sunset over the lake, August 2026', 'IMG_2165.JPG', '🌅', '#ff7043', '#5c6bc0'],
  ['Dog Max in the snow, January 2026', 'IMG_1702.JPG', '🐕', '#eceff1', '#90a4ae'],
  ['Church picnic, June 2026', 'IMG_2088.JPG', '🧺', '#aed581', '#fff176'],
  ['Tomatoes from the garden, August 2026', 'IMG_2150.JPG', '🍅', '#66bb6a', '#e53935'],
  ['Anne Marie and me at lunch, September 2026', 'IMG_2201.JPG', '🍽️', '#d7ccc8', '#6d4c41'],
  ['Christmas tree, December 2025', 'IMG_1650.JPG', '🎄', '#1b5e20', '#b71c1c'],
  ['Bird feeder with cardinal, March 2026', 'IMG_1810.JPG', '🐦', '#8bc34a', '#d32f2f'],
  ['Easter table, April 2026', 'IMG_1905.JPG', '🥚', '#fff9c4', '#ce93d8'],
  ['Harbor boats, August 2026', 'IMG_2172.JPG', '⛵', '#0277bd', '#e0f7fa'],
];
const svg = (emoji, a, b) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><text x="100" y="128" font-size="90" text-anchor="middle">${emoji}</text></svg>`);
const $ = (s) => document.getElementById(s);
let sel = [];
function paint() {
  for (const d of $('grid').children) d.classList.toggle('sel', sel.includes(d.dataset.file));
  for (const b of ['dl', 'share', 'fav', 'del']) $(b).disabled = !sel.length;
  $('count').textContent = sel.length ? sel.length + ' Selected' : '12 Photos';
}
for (const [alt, file, e, a, b] of PHOTOS) {
  const d = document.createElement('div');
  d.className = 'ph';
  d.dataset.file = file;
  d.dataset.alt = alt;
  const img = document.createElement('img');
  img.alt = alt;
  img.src = svg(e, a, b);
  d.appendChild(img);
  d.addEventListener('click', (ev) => {
    if (ev.ctrlKey || ev.metaKey) sel = sel.includes(file) ? sel.filter((f) => f !== file) : sel.concat(file);
    else sel = [file];
    paint();
  });
  d.addEventListener('dblclick', () => { $('vimg').src = img.src; $('vimg').alt = alt; $('viewer').hidden = false; });
  $('grid').appendChild(d);
}
$('vclose').onclick = () => { $('viewer').hidden = true; };
function signIn() {
  if (!$('pw').value) { $('pw').style.borderColor = '#e30000'; $('pw').placeholder = 'Enter your password'; return; }
  $('signin').hidden = true;
  $('lib').hidden = false;
  document.title = 'iCloud Photos';
}
$('signin-btn').onclick = signIn;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
$('dl').onclick = () => {
  const files = PHOTOS.filter((p) => sel.includes(p[1]));
  for (const p of files) SIM.addDownload({ name: p[1], from: p[0] });
  const bar = document.createElement('div');
  bar.id = 'dlbar';
  bar.setAttribute('role', 'status');
  bar.innerHTML = '<b>Recent download history</b><br>' + files.map((p) => '🖼️ ' + p[1] + ' — 3.1 MB • Done').join('<br>');
  document.body.appendChild(bar);
  setTimeout(() => bar.remove(), 8000);
};
$('del').onclick = () => SIM.toast('Deleting photos is turned off in this practice copy.');
</script>
</body></html>
