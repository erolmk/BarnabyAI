<!doctype html>
<html><head><meta charset="utf-8"><title>New Tab</title>
<style>
  body{margin:0;font:15px 'Segoe UI',Arial,sans-serif;background:#fff;color:#202124;height:100vh;overflow:hidden}
  .center{display:flex;flex-direction:column;align-items:center;padding-top:150px}
  .g{font-size:64px;font-weight:500;letter-spacing:-2px;margin-bottom:28px}
  #q{width:560px;height:46px;border:1px solid #dfe1e5;border-radius:24px;padding:0 20px;font-size:16px}
  .tiles{display:flex;gap:26px;margin-top:36px}
  .tiles a{display:flex;flex-direction:column;align-items:center;gap:8px;color:#202124;text-decoration:none;width:96px;font-size:13px}
  .tiles span{width:48px;height:48px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center;font-size:22px}
  .page{padding:40px 60px}
  ul{list-style:none;padding:0}li{padding:8px 0;border-bottom:1px solid #eee}
</style></head>
<body>
<div id="root"></div>
<script src="sim.js"></script>
<script>
const u = new URLSearchParams(location.search).get('u') || '';
const root = document.getElementById('root');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
if (!u) {
  root.innerHTML = `<div class="center"><div class="g"><span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span></div>
    <input id="q" aria-label="Search Google or type a URL" placeholder="Search Google or type a URL">
    <div class="tiles"><a href="https://mail.google.com"><span>✉️</span>Gmail</a><a href="https://www.youtube.com"><span>▶️</span>YouTube</a><a href="https://news.google.com"><span>📰</span>News</a><a href="https://weather.com"><span>☀️</span>Weather</a></div></div>`;
  const q = document.getElementById('q');
  q.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const v = q.value.trim();
    if (!v) return;
    location.href = /^https?:\/\//i.test(v) ? v : /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v) ? 'https://' + v : 'https://www.google.com/search?q=' + encodeURIComponent(v);
  });
} else if (/downloads/i.test(u)) {
  document.title = 'Downloads - File Explorer';
  root.innerHTML = '<div class="page"><h2>Downloads</h2><ul>' + SIM.downloads().map((f) => `<li>${esc(f.name)} — ${esc(f.date)} — ${esc(f.size)}</li>`).join('') + '</ul></div>';
} else {
  let host = u;
  try { host = new URL(u).hostname || u; } catch (_) {}
  document.title = /^ms-settings:/.test(u) ? 'Settings' : host;
  root.innerHTML = `<div class="page"><h1>${esc(document.title)}</h1><p>This is a practice copy of the page at <b>${esc(u)}</b>. Nothing else is on it.</p></div>`;
}
</script>
</body></html>
